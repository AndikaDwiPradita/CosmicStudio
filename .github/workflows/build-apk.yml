name: Build Cosmic Studio Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # This will be used as the default Java version for the build

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission
        run: chmod +x android/gradlew

      - name: Set Java Toolchain
        run: |
          echo "java" > android/java-toolchain-version.txt 2>/dev/null || echo "Creating toolchain config"
          # Create properties file for Gradle Java toolchain
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx512m" > ~/.gradle/gradle.properties

      - name: Build Android APK
        run: |
          cd android
          ANDROID_HOME=/usr/local/android/sdk ./gradlew assembleDebug -Djava.awt.headless=true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CosmicStudio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk