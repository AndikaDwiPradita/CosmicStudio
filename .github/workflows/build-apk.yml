name: Build Cosmic Studio Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Android SDK
        run: |
          ls /usr/local/android/sdk/ 2>/dev/null && echo "Android SDK found at /usr/local/android/sdk" || echo "Checking ANDROID_HOME..."
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/android/sdk}
          mkdir -p $ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ANDROID_HOME=$ANDROID_HOME ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CosmicStudio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk